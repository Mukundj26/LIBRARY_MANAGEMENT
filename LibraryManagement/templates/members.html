{% extends 'base.html' %}

{% block title %}Library Members{% endblock %}

{% block content %}
<div class="page-header-actions">
    <div class="search-bar">
        <i class="fa-solid fa-search"></i>
        <input type="text" id="memberSearchInput" placeholder="Search by name or email..." onkeyup="searchMembers()">
    </div>
    <button class="btn-primary" onclick="openModal('addMemberModal')">
        <i class="fa-solid fa-user-plus"></i> New Member
    </button>
</div>

<div class="table-container shadow">
    <table id="membersTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Created By</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Loaded via JS -->
        </tbody>
    </table>
</div>
{% endblock %}

{% block modals %}
<div id="addMemberModal" class="modal">
    <div class="modal-header">
        <h3>Register New Member</h3>
        <button class="close-btn" onclick="closeModal('addMemberModal')">&times;</button>
    </div>
    <form action="{{ url_for('members.add') }}" method="POST" class="modal-body p-20">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" required>
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phone" required pattern="[0-9]{10}" title="Please enter a 10-digit phone number" maxlength="10">
        </div>
        <div class="form-group">
            <label>Notes / Remarks</label>
            <textarea name="notes" placeholder="Extra details about member..."></textarea>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-text" onclick="closeModal('addMemberModal')">Cancel</button>
            <button type="submit" class="btn-primary">Register</button>
        </div>
    </form>
</div>

<div id="editMemberModal" class="modal">
    <div class="modal-header">
        <h3>Edit Member Details</h3>
        <button class="close-btn" onclick="closeModal('editMemberModal')">&times;</button>
    </div>
    <form id="editMemberForm" method="POST" class="modal-body p-20">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" id="edit_m_name" required>
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" id="edit_m_email" required>
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phone" id="edit_m_phone" required pattern="[0-9]{10}" title="Please enter a 10-digit phone number" maxlength="10">
        </div>
        <div class="form-group">
            <label>Notes / Remarks</label>
            <textarea name="notes" id="edit_m_notes"></textarea>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-text" onclick="closeModal('editMemberModal')">Cancel</button>
            <button type="submit" class="btn-primary">Update Member</button>
        </div>
    </form>
</div>

<div id="memberHistoryModal" class="modal">
    <div class="modal-header">
        <h3 id="historyTitle">Member Activity</h3>
        <button class="close-btn" onclick="closeModal('memberHistoryModal')">&times;</button>
    </div>
    <div class="modal-body p-20">
        <div class="history-list" id="historyContent">
            <!-- Loaded via JS -->
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function searchMembers() {
        const query = document.getElementById('memberSearchInput').value;
        fetch(`/api/members/search?q=${query}`)
            .then(res => res.json())
            .then(data => {
                const tbody = document.querySelector('#membersTable tbody');
                tbody.innerHTML = '';
                data.forEach(m => {
                    tbody.innerHTML += `
                        <tr>
                            <td>#${m.id}</td>
                            <td><strong>${m.name}</strong></td>
                            <td>${m.email}</td>
                            <td>${m.phone}</td>
                            <td><small>${m.created_by || 'System'}</small></td>
                            <td>
                                <button class="btn-icon" onclick='openEditMember(${JSON.stringify(m)})' title="Edit">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                                <button class="btn-icon" onclick="viewHistory(${m.id})" title="History">
                                    <i class="fa-solid fa-clock-rotate-left"></i>
                                </button>
                                <form action="/members/delete/${m.id}" method="POST" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this member?');">
                                    <button type="submit" class="btn-icon" style="color: #ef4444;" title="Delete">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    `;
                });
            });
    }

    function viewHistory(id) {
        fetch(`/members/history/${id}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('historyTitle').innerText = `${data.member.name}'s History`;
                const content = document.getElementById('historyContent');
                content.innerHTML = '';
                if(data.history.length === 0) {
                    content.innerHTML = '<p class="text-muted">No borrow history found.</p>';
                } else {
                    data.history.forEach(h => {
                        content.innerHTML += `
                            <div class="history-item">
                                <div class="h-info">
                                    <strong>${h.title}</strong>
                                    <small>${h.issue_date} to ${h.return_date || 'Ongoing'}</small>
                                </div>
                                <span class="badge ${h.status == 'issued' ? 'badge-orange' : 'badge-green'}">${h.status}</span>
                            </div>
                        `;
                    });
                }
                openModal('memberHistoryModal');
            });
    }

    function openEditMember(member) {
        document.getElementById('edit_m_name').value = member.name;
        document.getElementById('edit_m_email').value = member.email;
        document.getElementById('edit_m_phone').value = member.phone;
        document.getElementById('edit_m_notes').value = member.notes || '';
        document.getElementById('editMemberForm').action = `/members/edit/${member.id}`;
        openModal('editMemberModal');
    }

    window.onload = searchMembers;
</script>
{% endblock %}
